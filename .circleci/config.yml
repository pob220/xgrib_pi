version: 2.1
jobs:
  windows-ui-delay:
    parameters:
      arch: {type: string}
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Measure released plugin dialog startup in isolated profiles
          command: .\ci\test-rick-ui-delay.ps1 -Architecture << parameters.arch >>
          no_output_timeout: 10m
      - store_artifacts:
          path: artifacts/rick-ui-delay
workflows:
  isolated-windows-startup-investigation:
    jobs:
      - windows-ui-delay:
          name: windows-x86-ui-delay
          arch: x86
      - windows-ui-delay:
          name: windows-x64-ui-delay
          arch: x64
