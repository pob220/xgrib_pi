version: 2.1

parameters:
  run_workflow_deploy:
    type: boolean
    default: false

commands:
  retain-linux-artifacts:
    parameters:
      api_headers: {type: string, default: "1.21"}
    steps:
      - run:
          name: Prepare retained evidence
          when: always
          command: |
            mkdir -p artifacts
            if test -d build/artifacts; then cp -a build/artifacts/. artifacts/; fi
            rm -rf test-results
            mkdir -p test-results
            find artifacts -type f \
              \( -name 'ctest.xml' -o -name '*-ctest.xml' \) \
              -exec cp -f '{}' test-results/ \;
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts]

jobs:
  linux-catalogue:
    parameters:
      api_headers: {type: string, default: "1.21"}
      target: {type: string}
      image: {type: string}
      build_env: {type: string}
      dockerfile: {type: string, default: ci/Dockerfile.linux}
      resource_class: {type: string, default: medium}
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    environment:
      XGRIB_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: << parameters.target >>
      DOCKER_IMAGE: << parameters.image >>
      BUILD_ENV: << parameters.build_env >>
      DOCKERFILE: << parameters.dockerfile >>
      BUILD_GTK3: "true"
      WX_VER: "32"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
    steps:
      - checkout
      - run: chmod a+x ci/*.sh scripts/*.sh
      - run:
          name: Clean build, tests, package and validation
          command: ci/circleci-build-ubuntu-docker.sh
          no_output_timeout: 30m
      - retain-linux-artifacts:
          api_headers: << parameters.api_headers >>

  flatpak:
    parameters:
      api_headers: {type: string, default: "1.21"}
      arch: {type: string}
      resource_class: {type: string, default: medium}
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    environment:
      XGRIB_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: flatpak
      BUILD_ARCH: << parameters.arch >>
      FLATPAK_BRANCH: stable
      CLOUDSMITH_PKG_EXT: gz
      SDK_VER: "25.08"
      WX_VER: "32"
    steps:
      - checkout
      - run: chmod a+x ci/*.sh scripts/*.sh
      - run:
          name: Flatpak build, package and in-runtime merge
          command: ci/circleci-build-flatpak.sh
          no_output_timeout: 45m
      - retain-linux-artifacts:
          api_headers: << parameters.api_headers >>

  windows-vcpkg-dependencies:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    environment:
      XGRIB_WINDOWS_DEPS_ONLY: "1"
    steps:
      - checkout
      - restore_cache:
          keys:
            - windows-vcpkg-2026-06-24-mixed-release-v3-{{ checksum "ci/windows-vcpkg-deps.txt" }}-{{ checksum "ci/vcpkg-triplets/x64-windows-release.cmake" }}-{{ checksum "ci/vcpkg-triplets/x86-windows-release.cmake" }}
            - windows-vcpkg-2026-06-24-mixed-release-v3-
      - run:
          name: Prepare cached Release-only Windows dependencies
          command: .\ci\circleci-build-windows.ps1
          no_output_timeout: 45m
      - save_cache:
          key: windows-vcpkg-2026-06-24-mixed-release-v3-{{ checksum "ci/windows-vcpkg-deps.txt" }}-{{ checksum "ci/vcpkg-triplets/x64-windows-release.cmake" }}-{{ checksum "ci/vcpkg-triplets/x86-windows-release.cmake" }}
          paths:
            - cache/vcpkg-binary
      - store_artifacts:
          path: artifacts/windows-x86/logs
          destination: windows-dependency-logs

  windows-x86:
    parameters:
      api_headers: {type: string, default: "1.21"}
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    environment:
      XGRIB_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: MSVC
      WX_VER: "32"
    steps:
      - checkout
      - restore_cache:
          keys:
            - windows-vcpkg-2026-06-24-mixed-release-v3-{{ checksum "ci/windows-vcpkg-deps.txt" }}-{{ checksum "ci/vcpkg-triplets/x64-windows-release.cmake" }}-{{ checksum "ci/vcpkg-triplets/x86-windows-release.cmake" }}
      - run:
          name: Native Windows build, tests and package
          command: .\ci\circleci-build-windows.ps1
          no_output_timeout: 45m
      - run:
          name: Prepare JUnit results
          when: always
          command: |
            if (Test-Path test-results) { Remove-Item test-results -Recurse -Force }
            New-Item -ItemType Directory test-results | Out-Null
            if (Test-Path artifacts) {
              Get-ChildItem artifacts -Recurse -File -Filter "*ctest.xml" |
                ForEach-Object { Copy-Item $_.FullName -Destination test-results }
            }
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts]

  windows-x64:
    parameters:
      api_headers: {type: string, default: "1.21"}
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    environment:
      XGRIB_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: MSVC-x64
      WX_VER: "32"
    steps:
      - checkout
      - restore_cache:
          keys:
            - windows-vcpkg-2026-06-24-mixed-release-v3-{{ checksum "ci/windows-vcpkg-deps.txt" }}-{{ checksum "ci/vcpkg-triplets/x64-windows-release.cmake" }}-{{ checksum "ci/vcpkg-triplets/x86-windows-release.cmake" }}
      - run:
          name: Native Windows x64 OpenCPN 5.14.2 build, tests and package
          command: .\ci\circleci-build-windows.ps1 -PluginArchitecture x64
          no_output_timeout: 45m
      - run:
          name: Prepare x64 JUnit results
          when: always
          command: |
            New-Item -ItemType Directory -Force test-results | Out-Null
            if (Test-Path artifacts/windows-x64/tests) {
              Get-ChildItem artifacts/windows-x64/tests -File -Filter "*ctest.xml" |
                ForEach-Object { Copy-Item $_.FullName -Destination test-results }
            }
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts/windows-x64
          destination: windows-x64
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts/windows-x64]

  windows-opencpn-runtime:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Isolated OpenCPN package and GUI validation
          command: .\ci\circleci-test-windows-opencpn.ps1
          no_output_timeout: 10m
      - run:
          name: Prepare JUnit results
          when: always
          command: |
            if (Test-Path test-results) { Remove-Item test-results -Recurse -Force }
            New-Item -ItemType Directory test-results | Out-Null
            if (Test-Path artifacts) {
              Get-ChildItem artifacts -Recurse -File -Filter "*ctest.xml" |
                ForEach-Object { Copy-Item $_.FullName -Destination test-results }
            }
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts

  windows-generator-diagnostics:
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    environment:
      XGRIB_WINDOWS_DIAGNOSTICS_ONLY: "1"
    steps:
      - checkout
      - restore_cache:
          keys:
            - windows-vcpkg-2026-06-24-mixed-release-v3-{{ checksum "ci/windows-vcpkg-deps.txt" }}-{{ checksum "ci/vcpkg-triplets/x64-windows-release.cmake" }}-{{ checksum "ci/vcpkg-triplets/x86-windows-release.cmake" }}
      - run:
          name: Capture Windows generator crash dumps and stack traces
          command: .\ci\circleci-build-windows.ps1
          no_output_timeout: 30m
      - store_artifacts:
          path: artifacts/windows-x86/diagnostics
          destination: windows-generator-diagnostics
      - store_artifacts:
          path: artifacts/windows-x86/logs
          destination: windows-generator-build-logs

  macos-arm64:
    parameters:
      api_headers: {type: string, default: "1.21"}
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    environment:
      XGRIB_API_HEADER_VERSION: << parameters.api_headers >>
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - checkout
      - run: chmod a+x ci/*.sh scripts/*.sh
      - run:
          name: Native Apple-Silicon build, tests and package
          command: ci/circleci-build-macos-universal.sh
          no_output_timeout: 45m
      - run:
          name: Prepare JUnit results
          when: always
          command: |
            rm -rf test-results
            mkdir -p test-results
            find artifacts -type f \
              \( -name 'ctest.xml' -o -name '*-ctest.xml' \) \
              -exec cp -f '{}' test-results/ \;
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: artifacts
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts]

  android-arm64:
    parameters:
      api_headers: {type: string, default: "1.21"}
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      XGRIB_API_HEADER_VERSION: << parameters.api_headers >>
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - checkout
      - run:
          name: Install Android cross-build tools
          command: |
            sudo apt-get update
            sudo apt-get install -y git cmake curl unzip zip gettext python3 openjdk-17-jdk-headless ninja-build pkg-config autoconf autoconf-archive automake libtool linux-libc-dev
      - restore_cache:
          keys:
            - android-generator-v1-{{ checksum "ci/android-generator/vcpkg.json" }}-{{ checksum "ci/android-generator/arm64-android-release.cmake" }}-{{ checksum "ci/android-generator/ports/eccodes/portfile.cmake" }}-{{ checksum "ci/android-generator/ports/libsodium/portfile.cmake" }}
      - run:
          name: Build OpenCPN 5.14 core and xGRIB for Android arm64
          command: bash ci/build-android-arm64.sh
          no_output_timeout: 60m
      - store_artifacts:
          path: artifacts/android-arm64
      - when:
          condition:
            equal: ["1.21", << parameters.api_headers >>]
          steps:
            - persist_to_workspace:
                root: .
                paths: [artifacts/android-arm64]
      - save_cache:
          key: android-generator-v1-{{ checksum "ci/android-generator/vcpkg.json" }}-{{ checksum "ci/android-generator/arm64-android-release.cmake" }}-{{ checksum "ci/android-generator/ports/eccodes/portfile.cmake" }}-{{ checksum "ci/android-generator/ports/libsodium/portfile.cmake" }}
          paths:
            - ~/.cache/vcpkg/archives

  deploy-alpha:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install deployment client
          command: python -m pip install --user cloudsmith-cli
      - run:
          name: Upload reviewed Alpha artifacts
          command: bash ci/deploy-alpha-artifacts.sh

workflows:
  windows-ui-review:
    jobs:
      - windows-vcpkg-dependencies
      - windows-x86:
          requires: [windows-vcpkg-dependencies]
      - windows-x64:
          requires: [windows-vcpkg-dependencies]
      - windows-opencpn-runtime:
          requires: [windows-x86]
